[package]
name = "theodolite"
version = "0.1.0"
edition = "2024"
description = "Headless, deterministic LSP bridge MCP server: pinned language-server sessions exposed as bounded read tools for editor-free contexts."
license = "Apache-2.0"

[[bin]]
name = "theodolite"
path = "src/main.rs"

[[bin]]
name = "theodolite-fake-lsp"
path = "src/bin/fake_lsp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[profile.release]
debug = false
