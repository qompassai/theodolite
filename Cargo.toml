[package]
name = "theodolite"
version = "0.2.0"
edition = "2024"
description = "Headless, deterministic LSP bridge MCP server: pinned language-server sessions exposed as bounded read tools for editor-free contexts."
license = "Apache-2.0"

[[bin]]
name = "theodolite"
path = "src/main.rs"

[[bin]]
name = "theodolite-fake-lsp"
path = "src/bin/fake_lsp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
# WS2 Wave 4 (D-113): framing moves to the official Rust MCP SDK,
# modern era only (2026-07-28). The version pin is the fleet pin —
# one rmcp version across every estate server; bumps are single
# fleet events.
rmcp = { version = "=3.8.0", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }

[profile.release]
debug = false
