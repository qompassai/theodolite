# --- Salesforce / LWC: @salesforce/lwc-language-server 4.12.13
# (npm user prefix) via wrapper (no --version; needs --stdio).
# Diver lwc_ls. Serves the JS/HTML of LWC bundles; addressed by
# server name (the "js" extension is shared with the TypeScript
# stanza — unnamed routing of .js stays with the first claimant,
# per the bridge's ambiguity rule callers name this server for
# LWC work). diagnostics_owner = false.
[[server]]
id = "lwc-language-server"
binary = "/home/phaedrus/.local/share/theodolite/bin/lwc-lsp"
version_probe = ["--version"]
expect_version = "lwc-language-server 4.12.13"
languages = ["lwc"]
extensions = ["js", "html"]
language_ids = { js = "javascript", html = "html" }
readiness = "immediate"
diagnostics_owner = false
env = { PATH = "/home/phaedrus/.local/bin:/usr/local/bin:/usr/bin:/bin" }

# --- Salesforce / SOQL: @salesforce/soql-language-server 1.1.0
