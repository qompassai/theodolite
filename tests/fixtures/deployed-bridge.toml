# adopted 2026-11-09 (D-1124): primo already carries it and Strobe's
# reference Core is a modern .NET codebase. Diver's catalogued
# csharp-ls is NOT installed; the divergence is recorded, not
# drifted into. first-response readiness: solution load is the C#
# analogue of the workspace-load race.
[[server]]
id = "csharp-language-server"
