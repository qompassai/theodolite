# --- Nix: nil (Arch package, /usr/bin). Added 2026-11-15 by Owner
# order, closing the no-nix-route gap the SSD config audit found the
# same day. nil is the audit's proven server: in the diver pass it
# attached to all 139 files of the deployed tree, caught the planted
# syntax error, and found all 4 real syntax errors. nixd was NOT
# chosen: in the same audit's bulk run it attached to 0 files and
# nvim logged 15x "nixd_ls quit with exit code 0 and signal 13", and
# diver's nixd settings point its option lookup at another flake
# ("k-on"). nil --version prints "nil unknown" (the Arch build
# stamps no version) — the probe matches the printed string, per
# the wgsl-analyzer precedent above.
[[server]]
id = "nil"
binary = "/home/phaedrus/.cargo/bin/nil"
version_probe = ["--version"]
expect_version = "nil unknown"
languages = ["nix"]
extensions = ["nix"]
language_ids = { nix = "nix" }
readiness = "immediate"
diagnostics_owner = true
# Binary path repaired 2026-11-28 (next-10 set 1 gate):
# /usr/bin/nil no longer exists on primo; nil lives at
# ~/.cargo/bin/nil (probe still prints "nil unknown", so the
# pin is unchanged). The route was dead at spawn until this fix.
# nil publishes publishDiagnostics ONLY for non-empty sets: a
# clean file gets no notification at all (measured 2026-11-15/16,
# standalone and through the bridge), so the evidence-only
# settle wait held a clean file to the ready deadline and
# failed ServerNotReady. This opt-in is the scoped cure
# (theodolite branch pax/nil-clean-file-20261116): after 5 s of
# silence following the last content sync, the absent publish
# IS the empty set. nil's dirty-file publish lands in ~0.6 s;
# 5 s is ~8x that. Nil-only: every other stanza keeps the
# evidence-only predicate.
no_publish_means_empty_ms = 5000
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }

# --- Nix, deepened (next-10 set 1, 2026-11-28): nixd 2.7.0
# (nix-community; ~/.local/bin/nixd, a nix-store binary) serves
# nix SEMANTICS by name alongside nil: cross-file definition,
# references, hover, and -- with per-project provider config --
# NixOS option definition/hover. diagnostics_owner stays FALSE:
# nil keeps diagnostics ownership for .nix (ownership is per
# extension and settled at load; the statix/deadnix checkers below
# are cross-check for the same reason).
# PROVIDER LAYER (measured 2026-11-28, gates in
# theodolite-next10-20261128/EXECUTION.md): nixd's nixpkgs/options
# providers are per-project configuration (initializationOptions
# at the editor/workspace layer), NOT stanza material -- primo has
# no NIX_PATH and no channels, so a static expr would be fiction.
# Proven shape against a real nixosSystem flake: options provider
# expr (builtins.getFlake "<ws>").nixosConfigurations.<name>.options
# makes definition on services.openssh.enable land in sshd.nix,
# agreeing with the nix eval ground truth. A standalone
# lib.evalModules tree does NOT satisfy nixd's option lookup
# (measured: "attrname <seg> not found in attrset"); the provider
# wants a full system-shaped tree, which is the estate's real
# NixOS workload shape anyway.
[[server]]
id = "nixd"
binary = "/home/phaedrus/.local/bin/nixd"
version_probe = ["--version"]
expect_version = "nixd, version: 2.7.0"
languages = ["nix"]
extensions = ["nix"]
language_ids = { nix = "nix" }
readiness = "immediate"
diagnostics_owner = false
env = { PATH = "/home/phaedrus/.local/bin:/usr/local/bin:/usr/bin:/bin" }

