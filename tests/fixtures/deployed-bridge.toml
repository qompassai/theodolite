# --- Nix: nil (Arch package, /usr/bin). Added 2026-11-15 by Owner
# order, closing the no-nix-route gap the SSD config audit found the
# same day. nil is the audit's proven server: in the diver pass it
# attached to all 139 files of the deployed tree, caught the planted
# syntax error, and found all 4 real syntax errors. nixd was NOT
# chosen: in the same audit's bulk run it attached to 0 files and
# nvim logged 15x "nixd_ls quit with exit code 0 and signal 13", and
# diver's nixd settings point its option lookup at another flake
# ("k-on"). nil --version prints "nil unknown" (the Arch build
# stamps no version) — the probe matches the printed string, per
# the wgsl-analyzer precedent above.
[[server]]
id = "nil"
binary = "/usr/bin/nil"
version_probe = ["--version"]
expect_version = "nil unknown"
languages = ["nix"]
extensions = ["nix"]
language_ids = { nix = "nix" }
readiness = "immediate"
diagnostics_owner = true
# nil publishes publishDiagnostics ONLY for non-empty sets: a
# clean file gets no notification at all (measured 2026-11-15/16,
# standalone and through the bridge), so the evidence-only
# settle wait held a clean file to the ready deadline and
# failed ServerNotReady. This opt-in is the scoped cure
# (theodolite branch pax/nil-clean-file-20261116): after 5 s of
# silence following the last content sync, the absent publish
# IS the empty set. nil's dirty-file publish lands in ~0.6 s;
# 5 s is ~8x that. Nil-only: every other stanza keeps the
# evidence-only predicate.
no_publish_means_empty_ms = 5000
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }

