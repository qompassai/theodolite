# which needs an SDK, and the restored payload (5.4.0-2.26060.1)
# targets Microsoft.NETCore.App 10.0.0; primo carries only the
# runtime system-wide, so the stanza points at the user-level .NET
# root installed 2026-11-09 (~/.local/share/dotnet-sdk,
# dotnet-install.sh): SDK 8.0.427 + SDK/runtime 10.0.14 side by side.
env = { PATH = "/home/phaedrus/.local/share/dotnet-sdk:/usr/local/bin:/usr/bin:/bin", DOTNET_ROOT = "/home/phaedrus/.local/share/dotnet-sdk" }

