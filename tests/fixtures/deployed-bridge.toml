# Theodolite bridge config — full-coverage deployment.
#
# History: deployed 2026-11-03 (D-879) with ONE pinned server
# (rust-analyzer via ~/.cargo/bin, which is the rustup proxy — kept
# working by its PATH env, but against the example config's rule).
# Rebuilt 2026-11-09 under the Owner's order that agents use
# theodolite with LSPs for ALL file types: restores the canonical
# W4-proven Rust pairing (bacon-ls diagnostics owner + rust-analyzer
# semantics on the SPEC-pinned nightly toolchain binary, never the
# proxy) and adds a stanza for every language whose server exists on
# primo, per the D-151 coverage SPEC
# (~/workspace/theodolite-coverage-20261027/SPEC.md) plus Python and
# TypeScript, whose servers are installed and whose deferral the
# Owner's order supersedes for availability.
#
# Servers needing argv or a transport the bridge cannot express are
# reached through wrappers in ~/.local/share/theodolite/bin/ (the
# bridge spawns `binary` bare and probes `binary --version`):
#   taplo-lsp     -> taplo lsp stdio
#   ts-lsp        -> typescript-language-server --stdio
#   kotlin-lsp    -> kotlin-language-server (crashes on ANY argv;
#                    the wrapper answers the probe itself)
#   gdscript-lsp  -> socat stdio<->TCP 127.0.0.1:6005 (the GDScript
#                    LSP lives inside a running Godot editor)
#
# Ren'Py (.rpy) has NO stanza: no standalone or distro-packaged
# Ren'Py language server exists (SPEC SS4.9). Coverage there is an
# extraction slice (official VS Code extension's bundled server),
# still pending; until it lands, .rpy has no LSP route and agents
# must say so rather than improvise one.
#
# Every expect_version below was probed on primo on 2026-11-09.
# The bridge's version check is an EXACT full-string match against
# the probe's trimmed output (proven 2026-11-09: expect "0.10.0" vs
# probed "taplo 0.10.0" -> ServerVersionMismatch). Corrolary: the
# 2026-11-03 deployment's rust expect "1" could never have matched
# its probe output — that pin was broken from the day it landed.

request_timeout_ms = 120000
ready_timeout_ms = 300000
shutdown_grace_ms = 2000
mutation = "off"

# --- Rust: canonical pair. bacon-ls owns diagnostics (W4 parity:
# bridge diagnostics == standalone bacon-ls); rust-analyzer serves
# semantics, readiness quiescent (Slice 0 lesson: never read
# semantics from a server that has not reported quiescent).
[[server]]
id = "bacon-ls"
binary = "/home/phaedrus/.cargo/bin/bacon-ls"
version_probe = ["--version"]
expect_version = "0.23.0"
languages = ["rust"]
extensions = ["rs"]
language_ids = { rs = "rust" }
readiness = "immediate"
diagnostics_owner = true
# 2026-11-10 cure (theodolite Rust-route review): bacon-ls 0.23.0
# flipped its default backend from Bacon to Cargo. Without this
# option the server never reads .bacon-locations, and its Cargo
# backend cannot find the project root of a non-git workspace
# under the bridge (git rev-parse short-circuit), so every Rust
# diagnostics read through the bridge was a silent zero.
initialization_options = { useBaconBackend = true }
env = { PATH = "/home/phaedrus/.cargo/bin:/usr/local/bin:/usr/bin:/bin" }

[[server]]
id = "rust-analyzer"
binary = "/home/phaedrus/.rustup/toolchains/nightly-2026-09-25-x86_64-unknown-linux-gnu/bin/rust-analyzer"
version_probe = ["--version"]
expect_version = "rust-analyzer 1.100.0-nightly (f7575a9 2026-09-24)"
languages = ["rust"]
extensions = ["rs"]
language_ids = { rs = "rust" }
readiness = "quiescent"
initialization_options = {}
env = { PATH = "/home/phaedrus/.cargo/bin:/usr/local/bin:/usr/bin:/bin" }

# --- Lua: lua-language-server 3.19.2 (Arch package, /usr/bin).
[[server]]
id = "lua-language-server"
binary = "/usr/bin/lua-language-server"
version_probe = ["--version"]
expect_version = "3.19.2"
# 2026-11-24 coverage lane: same no-publish-on-clean shape as nil
# (LuaLS publishes only files WITH diagnostics on workspace load;
# clean-file bridge reads timed out at 200-280 s x3). Trial of the
# nil cure on this stanza; revert if the bridge ignores it here.
no_publish_means_empty_ms = 5000
languages = ["lua"]
extensions = ["lua"]
language_ids = { lua = "lua" }
readiness = "immediate"
diagnostics_owner = true
env = {}

