# --- Tier-2 / C-C++: clangd 23.1.5 (Arch package). Diver
# clangd_ls. Consumer: engine/native work, GDExtension, native RE.
[[server]]
id = "clangd"
binary = "/usr/bin/clangd"
version_probe = ["--version"]
expect_version = '''clangd version 23.1.5
Features: linux
Platform: x86_64-pc-linux-gnu'''
languages = ["cpp"]
extensions = ["c", "h", "cpp", "cxx", "cc", "hpp", "hh", "hxx"]
language_ids = { c = "c", h = "cpp", cpp = "cpp", cxx = "cpp", cc = "cpp", hpp = "cpp", hh = "cpp", hxx = "cpp" }
readiness = "immediate"
diagnostics_owner = true
env = { PATH = "/usr/local/bin:/usr/bin:/bin" }

